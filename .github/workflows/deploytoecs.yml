name: Build and Deploy to ECR and ECS

on:
  workflow_dispatch: 

# OIDC auth requires these two permissions
permissions:
  id-token: write
  contents: read

env:
  # Matching exact secret names from your GitHub repo (verified from old workflow)
  AWS_REGION:         ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPO_NAME:      ${{ secrets.ECR_REPO_NAME }}
  ECS_CLUSTER_NAME:   ${{ secrets.ECS_CLUSTER_NAME }}
  ECS_SERVICE_NAME:   ${{ secrets.ECS_SERVICE_NAME }}
  ECS_TASK_DEF_NAME:  ${{ secrets.ECS_TASK_DEF_NAME }}
  ECS_CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}
  IMAGE_TAG:          "v-${{ github.sha }}"

jobs:
  build-and-push:
    name: Build and push Docker image to ECR
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.set-image-uri.outputs.image_uri }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      # Save ECR registry using step-level env: (avoids ${{ }} inside run: scripts)
      - name: Save ECR registry to env
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "ECR_REGISTRY=$REGISTRY" >> $GITHUB_ENV

      - name: Build, tag and push to ECR
        run: |
          SHORT_TAG="v-${GITHUB_SHA::7}"
          FULL_URI="$ECR_REGISTRY/$ECR_REPO_NAME:$SHORT_TAG"

          echo "Building: $FULL_URI"
          docker build -t $FULL_URI .
          docker tag  $FULL_URI $ECR_REGISTRY/$ECR_REPO_NAME:latest

          docker push $FULL_URI
          docker push $ECR_REGISTRY/$ECR_REPO_NAME:latest

          # Save for next step
          echo "SHORT_TAG=$SHORT_TAG"   >> $GITHUB_ENV
          echo "FULL_URI=$FULL_URI"     >> $GITHUB_ENV

      - name: Set image URI as job output
        id: set-image-uri
        run: |
          echo "image_uri=$FULL_URI" >> $GITHUB_OUTPUT
          echo "Job output set: $FULL_URI"

