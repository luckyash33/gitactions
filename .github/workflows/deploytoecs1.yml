name: Build and Deploy to ECR and ECS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:         ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPO_NAME:      ${{ secrets.ECR_REPO_NAME }}
  ECS_CLUSTER_NAME:   ${{ secrets.ECS_CLUSTER_NAME }}
  ECS_SERVICE_NAME:   ${{ secrets.ECS_SERVICE_NAME }}
  ECS_TASK_DEF_NAME:  ${{ secrets.ECS_TASK_DEF_NAME }}
  ECS_CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}

jobs:

  # ============================================================
  # BUILD AND PUSH IMAGE
  # ============================================================
  build-and-push:
    name: Build and push Docker image to ECR
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS authentication
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      # --------------------------------------------------------
      # Build and push Docker image
      # --------------------------------------------------------
      - name: Build, tag and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="v-${GITHUB_SHA::7}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG"

          echo "=========================================="
          echo "ECR Registry : $ECR_REGISTRY"
          echo "Repository   : $ECR_REPO_NAME"
          echo "Image Tag    : $IMAGE_TAG"
          echo "Image URI    : $IMAGE_URI"
          echo "=========================================="

          docker build -t "$IMAGE_URI" .

          docker tag "$IMAGE_URI" \
            "$ECR_REGISTRY/$ECR_REPO_NAME:latest"

          docker push "$IMAGE_URI"

          docker push \
            "$ECR_REGISTRY/$ECR_REPO_NAME:latest"

          echo "Docker image pushed successfully."

      # --------------------------------------------------------
      # Set job output
      # --------------------------------------------------------
      - name: Set image URI output
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="v-${GITHUB_SHA::7}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "Job output:"
          echo "$IMAGE_URI"


  # ============================================================
  # DEPLOY TO ECS
  # ============================================================
  deploy-to-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      IMAGE_FULL_URI: ${{ needs.build-and-push.outputs.image_uri }}

    steps:

      # --------------------------------------------------------
      # AWS authentication
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Debug image URI
      # --------------------------------------------------------
      - name: Verify image URI
        run: |
          echo "IMAGE_FULL_URI=$IMAGE_FULL_URI"

          if [ -z "$IMAGE_FULL_URI" ]; then
            echo "ERROR: IMAGE_FULL_URI is empty!"
            exit 1
          fi

      # --------------------------------------------------------
      # Download current ECS task definition
      # --------------------------------------------------------
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEF_NAME" \
            --query taskDefinition \
            --output json > task-def.json

          echo "Current task definition:"
          cat task-def.json

      # --------------------------------------------------------
      # Update container image
      # --------------------------------------------------------
      - name: Update container image
        run: |
          jq --arg IMAGE "$IMAGE_FULL_URI" \
             --arg NAME "$ECS_CONTAINER_NAME" \
             '
             .containerDefinitions |= map(
               if .name == $NAME
               then .image = $IMAGE
               else .
               end
             )
             |
             del(
               .taskDefinitionArn,
               .revision,
               .status,
               .requiresAttributes,
               .compatibilities,
               .registeredAt,
               .registeredBy
             )
             ' task-def.json > new-task-def.json

          echo "=========================================="
          echo "Updated task definition:"
          echo "=========================================="

          cat new-task-def.json

      # --------------------------------------------------------
      # Verify container image isn't empty
      # --------------------------------------------------------
      - name: Verify task definition image
        run: |
          IMAGE=$(jq -r \
            --arg NAME "$ECS_CONTAINER_NAME" \
            '.containerDefinitions[] |
             select(.name == $NAME) |
             .image' \
            new-task-def.json)

          echo "Container: $ECS_CONTAINER_NAME"
          echo "Image:     $IMAGE"

          if [ -z "$IMAGE" ] || [ "$IMAGE" = "null" ]; then
            echo "ERROR: Container image is empty!"
            exit 1
          fi

      # --------------------------------------------------------
      # Register ECS task definition
      # --------------------------------------------------------
      - name: Register new task definition
        run: |
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "NEW_TASK_DEF_ARN=$NEW_ARN" >> "$GITHUB_ENV"

          echo "Registered task definition:"
          echo "$NEW_ARN"

      # --------------------------------------------------------
      # Update ECS service
      # --------------------------------------------------------
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --force-new-deployment

      # --------------------------------------------------------
      # Wait for deployment
      # --------------------------------------------------------
      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME"

          echo "=========================================="
          echo "Deployment completed successfully."
          echo "=========================================="
