name: Build and Deploy to ECR and ECS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:         ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPO_NAME:      ${{ secrets.ECR_REPO_NAME }}
  ECS_CLUSTER_NAME:   ${{ secrets.ECS_CLUSTER_NAME }}
  ECS_SERVICE_NAME:   ${{ secrets.ECS_SERVICE_NAME }}
  ECS_TASK_DEF_NAME:  ${{ secrets.ECS_TASK_DEF_NAME }}
  ECS_CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}
  IMAGE_TAG:          "${{ github.sha }}"

jobs:

  # ============================================================
  # BUILD AND PUSH IMAGE
  # ============================================================
  build-and-push:
    name: Build and push Docker image to ECR
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.set-image-uri.outputs.image_uri }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Save ECR registry to environment
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "ECR_REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

            - name: Build, tag and push to ECR
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPO_NAME"
          SHORT_TAG="v-${IMAGE_TAG::7}"
          FULL_URI="$IMAGE_URI:$SHORT_TAG"

          echo "Building: $FULL_URI"

          docker build -t "$FULL_URI" .

          docker tag "$FULL_URI" "$IMAGE_URI:latest"

          docker push "$FULL_URI"
          docker push "$IMAGE_URI:latest"

          echo "SHORT_TAG=$SHORT_TAG" >> "$GITHUB_ENV"
          echo "FULL_URI=$FULL_URI" >> "$GITHUB_ENV"

      - name: Set image URI as job output
        id: set-image-uri
        run: |
          echo "FULL_URI=[$FULL_URI]"

          if [ -z "$FULL_URI" ]; then
            echo "ERROR: FULL_URI is empty!"
            exit 1
          fi

          echo "image_uri=$FULL_URI" >> "$GITHUB_OUTPUT"

          echo "Output created successfully"

      - name: Verify job output
        run: |
          echo "Step output:"
          echo "${{ steps.set-image-uri.outputs.image_uri }}"


  # ============================================================
  # DEPLOY TO ECS
  # ============================================================
  deploy-to-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      IMAGE_FULL_URI: ${{ needs.build-and-push.outputs.image_uri }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ------------------------------------------------------------
      # Verify image URI passed from previous job
      # ------------------------------------------------------------
      - name: Verify image URI
        run: |
          echo "IMAGE_FULL_URI=[$IMAGE_FULL_URI]"

          if [ -z "$IMAGE_FULL_URI" ]; then
            echo "ERROR: IMAGE_FULL_URI is empty!"
            exit 1
          fi

      # ------------------------------------------------------------
      # Download current ECS task definition
      # ------------------------------------------------------------
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEF_NAME" \
            --query taskDefinition \
            > task-def.json

          echo "Current task definition:"
          cat task-def.json

      # ------------------------------------------------------------
      # Update container image
      # ------------------------------------------------------------
      - name: Update container image in task definition
        run: |
          jq --arg IMAGE "$IMAGE_FULL_URI" \
             --arg NAME "$ECS_CONTAINER_NAME" \
             '
             .containerDefinitions |= map(
               if .name == $NAME
               then .image = $IMAGE
               else .
               end
             )
             |
             del(
               .taskDefinitionArn,
               .revision,
               .status,
               .requiresAttributes,
               .compatibilities,
               .registeredAt,
               .registeredBy
             )
             ' task-def.json > new-task-def.json

          echo "Updated task definition:"
          cat new-task-def.json

      # ------------------------------------------------------------
      # Verify container image before registration
      # ------------------------------------------------------------
      - name: Verify container image
        run: |
          IMAGE=$(jq -r \
            --arg NAME "$ECS_CONTAINER_NAME" \
            '
            .containerDefinitions[]
            | select(.name == $NAME)
            | .image
            ' new-task-def.json)

          echo "Container name : $ECS_CONTAINER_NAME"
          echo "Container image: $IMAGE"

          if [ -z "$IMAGE" ] || [ "$IMAGE" = "null" ]; then
            echo "ERROR: Container image is empty!"
            exit 1
          fi

      # ------------------------------------------------------------
      # Register new task definition
      # ------------------------------------------------------------
      - name: Register new task definition revision
        run: |
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "NEW_TASK_DEF_ARN=$NEW_ARN" >> "$GITHUB_ENV"

          echo "Registered:"
          echo "$NEW_ARN"

      # ------------------------------------------------------------
      # Update ECS service
      # ------------------------------------------------------------
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --force-new-deployment

      # ------------------------------------------------------------
      # Wait for ECS deployment
      # ------------------------------------------------------------
      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME"

          echo "======================================"
          echo "Deployment completed successfully!"
          echo "======================================"
